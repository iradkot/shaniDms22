appId: com.shanidms22
tags:
  - product
---
# Rebuilt product smoke. This is intentionally independent of Firebase and
# Nightscout: it verifies personal Home, the catalogue and the navigation shell.
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: product-shell
    timeout: 30000

- assertVisible:
    id: product-home
- assertVisible:
    id: personal-home-view
- tapOn:
    id: home-tab-modules
- assertVisible:
    id: product-hub
- tapOn:
    id: hub-filter-toggle

- scrollUntilVisible:
    element:
      id: hub-category-grid
    direction: DOWN
    timeout: 15000

- scrollUntilVisible:
    element:
      id: hub-category-record
    direction: DOWN
    timeout: 15000

- tapOn:
    id: hub-category-record

- scrollUntilVisible:
    element:
      id: hub-grid-record-tile-core.activity
    direction: DOWN
    timeout: 15000

- tapOn:
    id: hub-grid-record-tile-core.activity

- assertNotVisible:
    id: product-hub
- assertVisible:
    id: shell-control-back
- assertVisible:
    id: shell-control-hub
- assertVisible:
    id: shell-control-forward

# Back returns to Home. The catalogue remains available from its tab.
- tapOn:
    id: shell-control-back
- extendedWaitUntil:
    visible:
      id: product-home
    timeout: 15000

# Forward restores the exact Module that Back just left.
- tapOn:
    id: shell-control-forward
- assertNotVisible:
    id: product-home
- tapOn:
    id: shell-control-hub
- extendedWaitUntil:
    visible:
      id: personal-home-view
    timeout: 15000

# Opening the same Module again and using Home resets to the personal root.
- tapOn:
    id: home-tab-modules
- tapOn:
    id: hub-filter-toggle
- scrollUntilVisible:
    element:
      id: hub-category-record
    direction: DOWN
    timeout: 15000
- tapOn:
    id: hub-category-record
- scrollUntilVisible:
    element:
      id: hub-grid-record-tile-core.activity
    direction: DOWN
    timeout: 15000
- tapOn:
    id: hub-grid-record-tile-core.activity
- tapOn:
    id: shell-control-hub
- extendedWaitUntil:
    visible:
      id: personal-home-view
    timeout: 15000

- takeScreenshot: product-hub-record-navigation
