name: E2E (Android - Maestro)

on:
  workflow_dispatch:
  workflow_call:

jobs:
  maestro-android:
    runs-on: ubuntu-latest
    env:
      SHANI_BACKEND_BASE_URL: ${{ vars.SHANI_BACKEND_BASE_URL }}
      FIRESTORE_RULES_SCHEMA_VERSION: ${{ vars.FIRESTORE_RULES_SCHEMA_VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (runner)
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before:"; df -h
          # GitHub hosted runners can be tight on free space, and the Android emulator
          # fails to start with: "Your device does not have enough disk space to run avd".
          # Remove large toolchains we don't use in this job.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift || true
          sudo apt-get clean || true
          echo "Disk after:"; df -h

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install JS dependencies
        run: yarn install --immutable

      - name: Install backend dependencies
        run: npm ci --prefix functions

      - name: Verify app, web, backend, rules, and credential policy
        run: yarn verify:all

      - name: Verify E2E entry and flow contracts
        run: yarn jest __tests__/e2e --runInBand

      - name: Install Maestro
        shell: bash
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Build E2E release APK
        working-directory: android
        env:
          E2E: 'true'
          ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
          ORG_GRADLE_PROJECT_TARGET_ABI: x86_64
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace -PALLOW_DEBUG_RELEASE_SIGNING=true :app:assembleRelease

      - name: Run Product smoke and preserved legacy regressions (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -accel off -gpu swiftshader_indirect -partition-size 2048
          script: |
            set -euo pipefail
            APK_PATH="android/app/build/outputs/apk/release/app-x86_64-release.apk"
            test -f "${APK_PATH}"
            echo "Using APK: ${APK_PATH}"
            adb install -r "${APK_PATH}"
            # Release gate: prove the rebuilt ProductExperience/Hub path first.
            maestro test e2e/maestro/product-hub-smoke.yaml
            # Keep every detailed legacy regression while Product modules migrate.
            maestro test e2e/maestro --exclude-tags=product
