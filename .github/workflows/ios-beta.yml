name: iOS Beta Deployment

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Install backend dependencies
        run: npm ci --prefix functions

      - name: Verify app, web, backend, rules, and credential policy
        run: yarn verify:all

  beta:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      TOOLCHAINS: com.apple.dt.toolchain.XcodeDefault
      APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      CI_KEYCHAIN_NAME: ci-signing
      CI_KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APP_STORE_CONNECT_PRIVATE_NOT_ENCODED_TO_64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_NOT_ENCODED_TO_64 }}
      SHANI_BACKEND_BASE_URL: ${{ vars.SHANI_BACKEND_BASE_URL }}
      FIRESTORE_RULES_SCHEMA_VERSION: ${{ vars.FIRESTORE_RULES_SCHEMA_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required GitHub Secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          required=(
            APPLE_PROVISIONING_PROFILE
            APPLE_CERTIFICATE_P12
            APPLE_CERTIFICATE_PASSWORD
            CI_KEYCHAIN_PASSWORD
            APP_STORE_CONNECT_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Secret: ${name}"
              missing=1
            fi
          done

          if [[ -z "${APP_STORE_CONNECT_PRIVATE_KEY:-}" && -z "${APP_STORE_CONNECT_PRIVATE_NOT_ENCODED_TO_64:-}" ]]; then
            echo "::error::Missing required GitHub Secret: APP_STORE_CONNECT_PRIVATE_KEY (or APP_STORE_CONNECT_PRIVATE_NOT_ENCODED_TO_64)"
            missing=1
          fi

          if (( missing != 0 )); then
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Use Xcode default toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --find clang

      - name: Preflight App Store Connect token
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail

          # Normalize key input: prefer base64 APP_STORE_CONNECT_PRIVATE_KEY, otherwise base64-encode PEM.
          if [[ -n "${APP_STORE_CONNECT_PRIVATE_KEY:-}" ]]; then
            SELECTED_KEY="${APP_STORE_CONNECT_PRIVATE_KEY}"
            echo "Using APP_STORE_CONNECT_PRIVATE_KEY (base64)."
          elif [[ -n "${APP_STORE_CONNECT_PRIVATE_NOT_ENCODED_TO_64:-}" ]]; then
            echo "Base64-encoding APP_STORE_CONNECT_PRIVATE_NOT_ENCODED_TO_64 for App Store Connect token."
            SELECTED_KEY="$(printf "%s" "${APP_STORE_CONNECT_PRIVATE_NOT_ENCODED_TO_64}" | base64)"
          else
            echo "::error::Missing App Store Connect private key (provide APP_STORE_CONNECT_PRIVATE_KEY or APP_STORE_CONNECT_PRIVATE_NOT_ENCODED_TO_64)."
            exit 1
          fi

          # Persist normalized key for later steps.
          echo "APP_STORE_CONNECT_PRIVATE_KEY=${SELECTED_KEY}" >> "$GITHUB_ENV"

          echo "Generating JWT via fastlane/spaceship..."
          JWT="$(bundle exec ruby -e '
          require "spaceship"
          key_b64 = ENV.fetch("APP_STORE_CONNECT_PRIVATE_KEY").gsub(/\s+/, "")
          t = Spaceship::ConnectAPI::Token.create(
            key_id: ENV.fetch("APP_STORE_CONNECT_KEY_ID"),
            issuer_id: ENV.fetch("APP_STORE_CONNECT_ISSUER_ID"),
            key: key_b64,
            is_key_content_base64: true,
            duration: 600
          )
          puts t.text
          ')" 

          echo "Calling App Store Connect API..."
          RESP_FILE="$(mktemp)"
          STATUS="$(curl -s -o "${RESP_FILE}" -w "%{http_code}" \
            -H "Authorization: Bearer ${JWT}" \
            "https://api.appstoreconnect.apple.com/v1/apps?limit=1")"

          if [[ "${STATUS}" == "200" ]]; then
            echo "ASC token OK"
          else
            echo "ASC token FAILED (HTTP ${STATUS}). Apple response body:"
            cat "${RESP_FILE}"
            echo "::error::ASC token FAILED (HTTP ${STATUS}). See Apple response body above for exact reason."
            exit 1
          fi

      - name: Install locked CocoaPods dependencies
        working-directory: ios
        run: bundle exec pod install --deployment

      - name: Sanity check App Store Connect env (no secret output)
        shell: bash
        run: |
          set -euo pipefail
          echo "APP_STORE_CONNECT_KEY_ID length: ${#APP_STORE_CONNECT_KEY_ID}"
          echo "APP_STORE_CONNECT_ISSUER_ID length: ${#APP_STORE_CONNECT_ISSUER_ID}"
          echo "APP_STORE_CONNECT_PRIVATE_KEY length: ${#APP_STORE_CONNECT_PRIVATE_KEY}"
          echo "APP_STORE_CONNECT_PRIVATE_NOT_ENCODED_TO_64 length: ${#APP_STORE_CONNECT_PRIVATE_NOT_ENCODED_TO_64}"

          if [ -z "${APP_STORE_CONNECT_KEY_ID:-}" ]; then
            echo "::error::Missing APP_STORE_CONNECT_KEY_ID (required for TestFlight upload)"
            exit 1
          fi

          if [ -z "${APP_STORE_CONNECT_ISSUER_ID:-}" ]; then
            echo "::error::Missing APP_STORE_CONNECT_ISSUER_ID (required for TestFlight upload)"
            exit 1
          fi

          if [ -z "${APP_STORE_CONNECT_PRIVATE_KEY:-}" ] && [ -z "${APP_STORE_CONNECT_PRIVATE_NOT_ENCODED_TO_64:-}" ]; then
            echo "::error::Missing App Store Connect private key (provide APP_STORE_CONNECT_PRIVATE_KEY or APP_STORE_CONNECT_PRIVATE_NOT_ENCODED_TO_64)"
            exit 1
          fi

      - name: Sanity check P12 on runner
        shell: bash
        run: |
          set -euo pipefail
          echo "P12 base64 length: ${#APPLE_CERTIFICATE_P12}"
          echo "Pass length: ${#APPLE_CERTIFICATE_PASSWORD}"

          if [ -z "${APPLE_CERTIFICATE_P12:-}" ]; then
            echo "::error::Missing APPLE_CERTIFICATE_P12 (base64 .p12)"
            exit 1
          fi

          if [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::error::Missing APPLE_CERTIFICATE_PASSWORD"
            exit 1
          fi

          CERT_P12="$RUNNER_TEMP/cert.p12"
          printf "%s" "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_P12"

          ls -lah "$CERT_P12"
          openssl pkcs12 -in "$CERT_P12" -passin pass:"$APPLE_CERTIFICATE_PASSWORD" -noout -info

      - name: Codesign import sanity (no fastlane)
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${APPLE_PROVISIONING_PROFILE:-}" ]; then
            echo "::error::Missing APPLE_PROVISIONING_PROFILE (base64 .mobileprovision)"
            exit 1
          fi

          if [ -z "${CI_KEYCHAIN_PASSWORD:-}" ]; then
            echo "::error::Missing CI_KEYCHAIN_PASSWORD"
            exit 1
          fi

          CERT_P12="$RUNNER_TEMP/cert.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/ci-signing.keychain-db"

          # Decode inputs
          printf "%s" "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_P12"
          printf "%s" "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE"

          echo "cert.p12 bytes: $(stat -f%z "$CERT_P12")"
          echo "profile bytes:  $(stat -f%z "$PROFILE")"

          # Create & unlock a fresh keychain
          security create-keychain -p "$CI_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$CI_KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Make it the only one in the search list for this step
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"

          echo "== Keychains =="
          security list-keychains -d user
          security default-keychain

          echo "== Import cert =="
          security import "$CERT_P12" \
            -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12

          # IMPORTANT: allow codesign to use the key non-interactively
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$CI_KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "== Identities in keychain =="
          security find-identity -v -p codesigning "$KEYCHAIN"

          echo "== Profiles dir =="
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/test.mobileprovision"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Run fastlane
        working-directory: ios
        run: bundle exec fastlane ios beta

      - name: Verify signed IPA entitlements
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          IPA="$(find ios/builds -type f -name '*.ipa' -print -quit 2>/dev/null || true)"
          if [[ -z "${IPA}" ]]; then
            echo "::warning::No IPA was produced, so signed entitlements could not be inspected."
            exit 0
          fi

          EXTRACTED="$(mktemp -d)"
          unzip -q "${IPA}" -d "${EXTRACTED}"
          APP="$(find "${EXTRACTED}/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "${APP}" ]]; then
            echo "::error::The IPA does not contain an app bundle."
            exit 1
          fi

          ENTITLEMENTS="${RUNNER_TEMP}/signed-entitlements.plist"
          codesign -d --entitlements :- "${APP}" > "${ENTITLEMENTS}" 2>/dev/null
          APNS_ENVIRONMENT="$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "${ENTITLEMENTS}")"
          if [[ "${APNS_ENVIRONMENT}" != "production" ]]; then
            echo "::error::Signed IPA must request production APNs; got '${APNS_ENVIRONMENT}'."
            exit 1
          fi
          echo "Signed IPA requests production APNs."

      - name: Preserve IPA and archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shaniDms22-ios-beta-${{ github.run_number }}
          path: |
            ios/builds/**/*.ipa
            ios/builds/**/*.xcarchive/**
          if-no-files-found: warn
          retention-days: 14

      - name: Dump gym log on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          LOG=$(ls -t /Users/runner/Library/Logs/gym/*.log 2>/dev/null | head -n 1 || true)
          if [ -z "$LOG" ]; then
            echo "No gym logs found"
            exit 0
          fi
          echo "Gym log: $LOG"
          tail -n 200 "$LOG"

      - name: Debug signing identities
        if: always()
        run: |
          security find-identity -v -p codesigning
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles || true
