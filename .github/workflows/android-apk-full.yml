name: Android APK (Full)
run-name: Android APK Full · ${{ inputs.signing }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      signing:
        description: 'Signing mode (production requires release signing secrets)'
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

jobs:
  build-apk-full:
    runs-on: ubuntu-latest
    env:
      SIGNING_MODE: ${{ inputs.signing }}
      SHANI_BACKEND_BASE_URL: ${{ vars.SHANI_BACKEND_BASE_URL }}
      FIRESTORE_RULES_SCHEMA_VERSION: ${{ vars.FIRESTORE_RULES_SCHEMA_VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes 2>/dev/null | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install JS dependencies
        run: yarn install --immutable

      - name: Install backend dependencies
        run: npm ci --prefix functions

      - name: Verify app, web, backend, rules, and credential policy
        run: yarn verify:all

      - name: Generate shared Android build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Shared clock-based sequence across Lite and Full; generate once per build.
          version_code=$((30000000 + $(date -u +%s) - 1767225600))
          if (( version_code < 30000000 || version_code > 2100000000 )); then
            echo "::error::Android version code is outside the supported range."
            exit 1
          fi
          version_name="1.0.${GITHUB_RUN_NUMBER}"
          if [ "$SIGNING_MODE" = preview ]; then
            version_name="${version_name}-preview"
          fi
          echo "code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "### Android Full: ${SIGNING_MODE}" >> "$GITHUB_STEP_SUMMARY"
          echo "Version ${version_name}; version code ${version_code}." >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIGNING_MODE" = preview ]; then
            echo "Internal preview, signed with the debug certificate. Not for Google Play." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Decode release keystore
        if: env.SIGNING_MODE == 'production'
        id: keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required Android release secret: ${name}"
              exit 1
            fi
          done
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/release.keystore
          echo "path=${GITHUB_WORKSPACE}/android/release.keystore" >> "$GITHUB_OUTPUT"

      - name: 'Build production APKs (Full profile: all common ABIs)'
        if: env.SIGNING_MODE == 'production'
        working-directory: android
        env:
          ALLOW_DEBUG_RELEASE_SIGNING: 'false'
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_reactNativeArchitectures: armeabi-v7a,arm64-v8a,x86,x86_64
          ORG_GRADLE_PROJECT_TARGET_ABI: armeabi-v7a,arm64-v8a,x86,x86_64
          ORG_GRADLE_PROJECT_VERSION_CODE: ${{ steps.version.outputs.code }}
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace clean :app:assembleRelease

      - name: 'Build internal preview APKs (all common ABIs, debug certificate)'
        if: env.SIGNING_MODE == 'preview'
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: armeabi-v7a,arm64-v8a,x86,x86_64
          ORG_GRADLE_PROJECT_TARGET_ABI: armeabi-v7a,arm64-v8a,x86,x86_64
          ORG_GRADLE_PROJECT_VERSION_CODE: ${{ steps.version.outputs.code }}
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace clean -PALLOW_DEBUG_RELEASE_SIGNING=true :app:assembleRelease

      - name: Upload APK artifacts (Full)
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-full-${{ env.SIGNING_MODE == 'preview' && 'preview-debug-signed' || 'production-signed' }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/*.apk
